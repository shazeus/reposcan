[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcan"
version = "0.1.4"
description = "GitHub repository analytics from your terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "shazeus"},
]
keywords = ["github", "analytics", "cli", "repository", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/shazeus/reposcan"
Repository = "https://github.com/shazeus/reposcan"
Issues = "https://github.com/shazeus/reposcan/issues"

[project.scripts]
reposcan = "reposcan.cli:cli"

[tool.setuptools.packages.find]
include = ["reposcan*"]
